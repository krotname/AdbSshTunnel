name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    # Home runners accept only owner-controlled source; forks need an owner branch.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner) ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["arc-prod-adler-adbsshtunnel"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Red cache contract
        run: arc-cache check-workflow --file .github/workflows/ci.yml --job "$GITHUB_JOB"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Mandatory OpenSpec validation and change coverage
        shell: bash
        env:
          OPENSPEC_TELEMETRY: '0'
          SPEC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run spec:validate
          python3 tools/test-openspec.py
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 tools/check-openspec.py --snapshot
          else
            python3 tools/check-openspec.py --base "$SPEC_BASE_SHA"
          fi
      - name: Native connection lifecycle regression
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror tools/test-tunnel-parent.c -o "$RUNNER_TEMP/tunnel-parent-test"
          "$RUNNER_TEMP/tunnel-parent-test"
          cc -std=c11 -Wall -Wextra -Werror tools/test-root-controller.c -o "$RUNNER_TEMP/root-controller-test"
          "$RUNNER_TEMP/root-controller-test"
          cc -std=c11 -Wall -Wextra -Werror app/src/main/cpp/root-controller.c -o "$RUNNER_TEMP/root-controller-compile-check"
      - name: Configure toolchain paths
        shell: bash
        run: |
          echo "ANDROID_HOME=$ARC_CACHE_DIR/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ARC_CACHE_DIR/android-sdk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Prepare pinned native source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/tfonteyn/Sshd4a.git vendor/Sshd4a
          git -C vendor/Sshd4a checkout --detach 897f9064a7279bff89538ec87729c43888f3b83d
          python3 tools/prepare-native.py
          python3 tools/check-source.py
      - name: Linux SSH protocol regression and packages
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/adbssh-linux"
          "$RUNNER_TEMP/adbssh-linux/bin/pip" install --disable-pip-version-check asyncssh==2.24.0
          timeout 60 "$RUNNER_TEMP/adbssh-linux/bin/python" -m unittest discover -s linux/tests -v
          "$RUNNER_TEMP/adbssh-linux/bin/python" linux/build-deb.py --arch arm64 --output linux/out
          "$RUNNER_TEMP/adbssh-linux/bin/python" linux/build-deb.py --arch amd64 --output linux/out
      - name: Tests, lint and unsigned release
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/host-key-check"
          javac -d "$RUNNER_TEMP/host-key-check" app/src/main/java/name/krot/adbsshtunnel/HostKeyPublic.java tools/TestHostKeyPublic.java
          java -cp "$RUNNER_TEMP/host-key-check" TestHostKeyPublic
          bash tools/ci-build.sh
      - name: Save portable Gradle dependencies
        if: always()
        run: arc-cache gradle-save
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/*/release/*-unsigned.apk
            app/build/outputs/bundle/rustoreRelease/*.aab
            linux/out/*.deb
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: app/build/reports/
          retention-days: 1
