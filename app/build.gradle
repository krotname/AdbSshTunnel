plugins { id 'com.android.application' }
android {
    namespace 'name.krot.adbsshtunnel'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'name.krot.adbsshtunnel'
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName '2.4.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        // Identical native inputs let AGP share one job-local build per ABI.
        externalNativeBuild { cmake {
            arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                "-DROOT_CONTROLLER_ASSETS_DIR=${layout.buildDirectory.dir('generated/root-controller-assets/common').get().asFile}",
                "-DTUNNEL_JNI_DIR=${layout.buildDirectory.dir('generated/tunnel-jni/common').get().asFile}"
            targets 'jni-dropbear', 'tunnel-server', 'root-controller'
        } }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'distribution'
    productFlavors {
        full {
            dimension 'distribution'
            buildConfigField 'boolean', 'WIRELESS_HOLD_SUPPORTED', 'true'
        }
        rustore {
            dimension 'distribution'
            buildConfigField 'boolean', 'WIRELESS_HOLD_SUPPORTED', 'false'
        }
    }
    externalNativeBuild { cmake { path file('CMakeLists.txt'); version '3.22.1' } }
    sourceSets {
        full {
            assets.srcDir layout.buildDirectory.dir('generated/root-controller-assets/common')
            jniLibs.srcDir layout.buildDirectory.dir('generated/tunnel-jni/common')
        }
        rustore {
            assets.srcDir layout.buildDirectory.dir('generated/root-controller-assets/common')
            jniLibs.srcDir layout.buildDirectory.dir('generated/tunnel-jni/common')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
tasks.configureEach { task ->
    if (task.name ==~ /merge(Full|Rustore)(Release|Debug)Assets/)
        task.dependsOn task.name.replace('merge', 'externalNativeBuild').replace('Assets', '')
    if (task.name ==~ /merge(Full|Rustore)(Release|Debug)JniLibFolders/)
        task.dependsOn task.name.replace('merge', 'externalNativeBuild').replace('JniLibFolders', '')
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
