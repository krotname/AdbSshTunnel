schema: spec-driven

context: |
  Требования, сценарии, proposal, design и tasks пишутся на русском языке.
  Заголовки OpenSpec и ключевые слова SHALL, WHEN, THEN сохраняются для CLI.
  В репозитории два разных продукта: Android и Linux.
  Android: Java/native C/Gradle, Android 11+, full и RuStore.
  Linux: Python/AsyncSSH/GTK4/Libadwaita, пользовательская systemd-служба, Debian.
  Android перенаправляет виртуальный 127.0.0.1:5555 в локальный adbd устройства.
  Linux перенаправляет только 127.0.0.1:5037 — протокол SDK ADB server.
  SSH только по ключам и только forwarding. Неизвестная сеть закрывает доступ.
  Android использует SSID/оператора; Linux — SSID/NetworkManager UUID.
  Минимум RSA Android 2048 бит, Linux 3072 бит; лимиты Android не общие.
  Проверку поведения определяют исходники, тесты и реальные device acceptance.
  CI сохраняет один отдельный Red ARC runner репозитория и постоянный кэш.
  Приватные ключи, личные идентификаторы устройств и секреты сюда не включаются.

rules:
  proposal:
    - Пиши по-русски; укажи затронутые возможности и Android, Linux или обе платформы.
    - Опиши наблюдаемое поведение, совместимость и последствия безопасности.
  specs:
    - Используй русские требования с SHALL и явные сценарии WHEN/THEN.
    - Учитывай запрет доступа, отзыв и восстановление.
    - Различай Android adbd и Linux SDK ADB server, сети, ключи и жизненный цикл.
  design:
    - Ссылайся на исходники, существующие тесты и процедуры приёмки.
    - Сохраняй закрытие доступа при неизвестных условиях и контракт CI/кэша.
  tasks:
    - Включи положительные и отрицательные проверки и границы device evidence.
    - Различай CI, merge, подпись, установку и публикацию.
